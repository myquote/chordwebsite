name: Convert Chord JS to JSON

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: GitHub Release asset ID
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: chord-js-import
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download ZIP
        env:
          ASSET_ID: ${{ inputs.asset_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --location --retry 3 \
            -H "Accept: application/octet-stream" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" \
            --output /tmp/chord-source.zip

          test -s /tmp/chord-source.zip
          unzip -t /tmp/chord-source.zip

      - name: Install parser
        run: npm install --no-save acorn@8

      - name: Convert JS to JSON
        run: node scripts/convert-js-to-json.mjs
        env:
          ZIP_PATH: /tmp/chord-source.zip

      - name: Commit JSON data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "Import chord data from JS archive"
            git push
          fi
